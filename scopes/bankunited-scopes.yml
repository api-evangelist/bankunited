notes: >-
  These scopes are the scopes_supported list advertised by the BankUnited API
  Experience Hub OIDC discovery document. Because the portal runs on Salesforce
  Experience Cloud, this list is the standard Salesforce OAuth 2.0 connected-app
  scope catalog (openid/profile/email/api/refresh_token plus Salesforce platform
  scopes such as cdp_*, wave_api, pardot_api, einstein_gpt_api, mcp_api) rather
  than BankUnited-specific banking-product scopes. The product-level API
  authorization scopes for BankUnited's own API contracts are defined per API and
  sit behind portal registration/login. Captured verbatim, honestly flagged as
  platform scopes.
