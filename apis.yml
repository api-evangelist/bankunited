name: BankUnited
kind: company
description: >-
  BankUnited, N.A. is a national bank (OCC-chartered National Association) and
  the principal subsidiary of BankUnited, Inc. (NYSE: BKU), a bank holding
  company headquartered in Miami Lakes, Florida. With roughly $35 billion in
  total assets and banking centers across Florida, the New York metro area,
  Dallas, Atlanta, New Jersey and North Carolina, it is a mid-size regional
  commercial and consumer bank focused on business banking, commercial lending
  and treasury/depository services. On the open-finance front, BankUnited runs a
  first-party developer portal branded the "API Experience Hub"
  (developer.bankunited.com), a Salesforce Experience Cloud site fronting a
  MuleSoft Anypoint Exchange catalog with self-service registration, OAuth
  application provisioning and API contracts; the specific API products and any
  OpenAPI specifications sit behind portal registration/login rather than being
  openly downloadable. No FDX-conformant public data-access API or published
  CFPB Section 1033 posture is documented; consumer-permissioned account data is
  reached primarily through third-party aggregators (e.g. Plaid) rather than a
  public first-party consumer data API.
